<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>To-Do List</title>\n    <style>\n        body {font-family: Arial, sans-serif; margin: 20px;}\n        #todo-form {margin-bottom: 20px;}\n        .todo-item {display: flex; justify-content: space-between; margin: 5px 0;}\n        .todo-item input {flex: 1;}\n        .todo-item button {margin-left: 10px;}\n    </style>\n</head>\n<body>\n    <h1>To-Do List Application</h1>\n    <form id=\"todo-form\">\n        <input type=\"text\" id=\"todo-input\" placeholder=\"Add a new to-do...\" required>\n        <button type=\"submit\">Add</button>\n    </form>\n    <div id=\"todo-list\"></div>\n    <script>\n        const todoForm = document.getElementById('todo-form');\n        const todoInput = document.getElementById('todo-input');\n        const todoList = document.getElementById('todo-list');\n\n        // Load todos from local storage upon page load\n        document.addEventListener('DOMContentLoaded', loadTodos);\n\n        todoForm.addEventListener('submit', function(event) {\n            event.preventDefault();\n            addTodo();\n        });\n\n        function addTodo() {\n            const todoText = todoInput.value;\n            const todoItem = document.createElement('div');\n            todoItem.classList.add('todo-item');\n\n            todoItem.innerHTML = `\n                <input type='checkbox'>\n                <span>${todoText}</span>\n                <button onclick='removeTodo(this)'>Remove</button>\n            `;\n            todoList.appendChild(todoItem);\n            saveTodoToLocalStorage(todoText);\n            todoInput.value = '';\n        }\n\n        function removeTodo(button) {\n            const todoItem = button.parentElement;\n            todoList.removeChild(todoItem);\n            removeTodoFromLocalStorage(todoItem.querySelector('span').innerText);\n        }\n\n        function saveTodoToLocalStorage(todo) {\n            const todos = JSON.parse(localStorage.getItem('todos')) || [];\n            todos.push(todo);\n            localStorage.setItem('todos', JSON.stringify(todos));\n        }\n\n        function removeTodoFromLocalStorage(todo) {\n            let todos = JSON.parse(localStorage.getItem('todos')) || [];\n            todos = todos.filter(t => t !== todo);\n            localStorage.setItem('todos', JSON.stringify(todos));\n        }\n\n        function loadTodos() {\n            const todos = JSON.parse(localStorage.getItem('todos')) || [];\n            todos.forEach(todo => {\n                const todoItem = document.createElement('div');\n                todoItem.classList.add('todo-item');\n                todoItem.innerHTML = `\n                    <input type='checkbox'>\n                    <span>${todo}</span>\n                    <button onclick='removeTodo(this)'>Remove</button>\n                `;\n                todoList.appendChild(todoItem);\n            });\n        }\n    </script>\n</body>\n</html>
